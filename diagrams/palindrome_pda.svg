<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#222"/></marker></defs><style>text{font:16px Arial;fill:#111}.s{fill:white;stroke:#222;stroke-width:2}.e{fill:none;stroke:#222;stroke-width:2;marker-end:url(#a)}</style><text x="25" y="30" font-weight="bold">Nondeterministic PDA for palindromes over {a,b}</text><path class="e" d="M25 130H80"/><circle class="s" cx="120" cy="130" r="34"/><circle class="s" cx="365" cy="130" r="44"/><circle class="s" cx="650" cy="130" r="44"/><circle cx="650" cy="130" r="36" fill="none" stroke="#222"/><g text-anchor="middle"><text x="120" y="136">q_push</text><text x="365" y="136">q_guess</text><text x="650" y="136">q_match</text></g><path class="e" d="M154 130H321"/><path class="e" d="M365 86C330 35 400 35 365 86"/><path class="e" d="M409 130H606"/><path class="e" d="M650 86C600 30 700 30 650 86"/><text x="240" y="112">push symbols</text><text x="365" y="55" text-anchor="middle">nondeterministically guess midpoint</text><text x="510" y="112">switch phase</text><text x="650" y="55" text-anchor="middle">match/pop equal symbols</text><text x="450" y="220" text-anchor="middle">Odd-length branch: consume one middle symbol without pushing or popping.</text><text x="450" y="250" text-anchor="middle">Accept when input is exhausted and the stack returns to its bottom marker.</text><text x="450" y="280" text-anchor="middle">The simulator checks all possible midpoint guesses.</text></svg>