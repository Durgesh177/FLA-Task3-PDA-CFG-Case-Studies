<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#222"/></marker></defs><style>text{font:16px Arial;fill:#111}.s{fill:white;stroke:#222;stroke-width:2}.e{fill:none;stroke:#222;stroke-width:2;marker-end:url(#a)}</style><text x="25" y="30" font-weight="bold">Stack PDA concept for (), [] and {}</text><path class="e" d="M30 140H100"/><circle class="s" cx="145" cy="140" r="38"/><rect class="s" x="285" y="92" width="270" height="96" rx="14"/><circle class="s" cx="700" cy="140" r="42"/><circle cx="700" cy="140" r="35" fill="none" stroke="#222"/><text x="145" y="146" text-anchor="middle">q0</text><text x="420" y="125" text-anchor="middle">Read input</text><text x="420" y="151" text-anchor="middle">open: push type</text><text x="420" y="174" text-anchor="middle">close: match and pop</text><text x="700" y="146" text-anchor="middle">q_accept</text><path class="e" d="M183 140H285"/><path class="e" d="M555 140H658"/><path class="e" d="M420 92C420 48 145 48 145 102"/><text x="285" y="60">Continue while input remains</text><text x="425" y="235" text-anchor="middle">Accept when input is exhausted and stack is empty.</text><text x="425" y="265" text-anchor="middle">A mismatched closer or a closer with an empty stack rejects.</text></svg>