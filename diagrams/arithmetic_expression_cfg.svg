<svg xmlns="http://www.w3.org/2000/svg" width="850" height="320"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#222"/></marker></defs><style>text{font:17px Arial;fill:#111}.b{fill:white;stroke:#222;stroke-width:2}.e{fill:none;stroke:#222;stroke-width:2;marker-end:url(#a)}</style><text x="25" y="30" font-weight="bold">Precedence-aware CFG structure (EBNF)</text><rect class="b" x="80" y="70" width="150" height="58" rx="10"/><rect class="b" x="350" y="70" width="150" height="58" rx="10"/><rect class="b" x="620" y="70" width="150" height="58" rx="10"/><g text-anchor="middle"><text x="155" y="106">Expression E</text><text x="425" y="106">Term T</text><text x="695" y="106">Factor F</text></g><path class="e" d="M230 99H350"/><path class="e" d="M500 99H620"/><rect class="b" x="80" y="190" width="690" height="80" rx="10"/><text x="425" y="222" text-anchor="middle">E → T ((+ | −) T)*    |    T → F ((* | /) F)*</text><text x="425" y="250" text-anchor="middle">F → −F | (E) | identifier | integer</text><path class="e" d="M155 128V190"/><path class="e" d="M425 128V190"/><path class="e" d="M695 128V190"/><text x="425" y="302" text-anchor="middle">Recursive descent: E handles +/−; T handles */; F handles atoms, unary minus and parentheses.</text></svg>